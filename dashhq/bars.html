<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Every bar · dashhq shell</title>
<link rel="icon" href="mark/favicon.svg" type="image/svg+xml">
<script src="dashhq-shell.js"></script>
<link rel="preload" href="fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="dashhq-tokens.css">
<link rel="stylesheet" href="dashhq-shell.css">
<link rel="stylesheet" href="dashhq-components.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<main class="page">
  <header class="intro">
    <p class="dh-label">dashhq shell · every bar</p>
    <h1 class="dh-h1">Fourteen products, one lockup</h1>
    <p class="dh-lead">Each bar below carries the attributes, logo and actions its site uses. On a phone every one shows
      the mark, "dashhq" and the product name. Short of room, the network pill drops its word first; the product name
      truncates only after that.</p>
  </header>
  <div class="bars bars--bleed" id="bars">
    <dashhq-bar product="home"></dashhq-bar>
    <dashhq-bar product="radar" network="mainnet" networks="mainnet testnet"></dashhq-bar>
    <dashhq-bar product="gov" network="mainnet" networks="mainnet testnet" network-settings="#settings">
      <div slot="actions"><button class="dh-btn dh-btn--icon dh-btn--quiet" type="button" aria-label="Account"><svg class="demo-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0zM3.5 17c.9-3 3.4-4.5 6.5-4.5s5.6 1.5 6.5 4.5"/></svg></button></div>
    </dashhq-bar>
    <dashhq-bar product="explorer" network="testnet" networks="mainnet testnet devnet-paloma" network-settings="#settings">
      <div slot="actions"><a class="dh-btn dh-btn--icon dh-btn--quiet" href="#search" aria-label="Search Explorer"><svg class="demo-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M14 8.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zM12.5 12.5l4.5 4.5"/></svg></a></div>
    </dashhq-bar>
    <dashhq-bar product="faucet" network="testnet"></dashhq-bar>
    <dashhq-bar product="bridge" network="testnet" networks="mainnet testnet"></dashhq-bar>
    <dashhq-bar product="fees" network="mainnet" networks="mainnet testnet"></dashhq-bar>
    <dashhq-bar product="dapi" network="mainnet" networks="mainnet testnet"></dashhq-bar>
    <dashhq-bar product="arch"></dashhq-bar>
    <dashhq-bar product="vote"></dashhq-bar>
    <dashhq-bar product="basics"></dashhq-bar>
    <dashhq-bar product="forge" network="testnet">
      <svg slot="logo" class="logo-forge" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7.5h9l-1.5 3H6zM9 10.5v4.5M6.5 15h5M13 7.5l3-2"/></svg>
      <div slot="actions"><button class="dh-btn dh-btn--sm" type="button">Sign in</button></div>
    </dashhq-bar>
    <dashhq-bar product="pollr" network="testnet">
      <svg slot="logo" class="logo-pollr" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V4M4 16h12M7.5 13V9M11 13V6.5M14.5 13v-2.5"/></svg>
      <div slot="actions"><button class="dh-btn dh-btn--sm" type="button">Sign in</button></div>
    </dashhq-bar>
    <dashhq-bar product="yappr" network="testnet">
      <div slot="actions"><button class="dh-btn dh-btn--sm" type="button">Sign in</button></div>
    </dashhq-bar>
  </div>
</main>
</body>
</html>
